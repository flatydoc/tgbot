# Деплой на Railway: https://railway.app
# Variables: BOT_TOKEN, ADMIN_IDS, DATA_DIR=/data
# Том: Settings → Volumes → mount path /data
# Включите у сервиса публичный доступ (Networking / Generate Domain), иначе healthcheck может не достучаться

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
