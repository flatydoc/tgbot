# Деплой на Railway: https://railway.app
# Переменные задайте в Dashboard → Variables: BOT_TOKEN, ADMIN_IDS
# Том для SQLite: Settings → Volumes → mount path /data, Variable DATA_DIR=/data

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
